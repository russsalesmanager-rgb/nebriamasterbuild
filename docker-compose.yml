services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nebria-postgres
    environment:
      POSTGRES_DB: nebria
      POSTGRES_USER: nebria
      POSTGRES_PASSWORD: nebria
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebria"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nebria-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nebria-api
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_NAME: nebria
      DB_USER: nebria
      DB_PASS: nebria
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: dev_jwt_secret_min_32_characters_long
      REFRESH_SECRET: dev_refresh_secret_min_32_characters_long
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nebria-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  # Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nebria-worker
    environment:
      NODE_ENV: development
      DB_NAME: nebria
      DB_USER: nebria
      DB_PASS: nebria
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nebria-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run worker

  # MinIO (S3-compatible storage for local dev)
  minio:
    image: minio/minio:latest
    container_name: nebria-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Setup (Create bucket)
  minio-setup:
    image: minio/mc:latest
    container_name: nebria-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/nebria-media --ignore-existing;
      mc anonymous set public myminio/nebria-media;
      exit 0;
      "

  # Frontend Static Server
  frontend:
    image: node:18-alpine
    container_name: nebria-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    command: npx http-server -p 8080 -c-1

volumes:
  pgdata:
  minio_data:
