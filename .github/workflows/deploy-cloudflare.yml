name: Deploy to Cloudflare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name nebria-frontend

  deploy-api-container:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Cloudflare Container Registry
        run: |
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | docker login -u cloudflare --password-stdin registry.cloudflare.com
      
      - name: Build and push API container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: registry.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/nebria-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy API container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: containers deploy nebria-api --env production

  deploy-worker-container:
    runs-on: ubuntu-latest
    needs: deploy-api-container
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Cloudflare Container Registry
        run: |
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | docker login -u cloudflare --password-stdin registry.cloudflare.com
      
      - name: Build and push Worker container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/cloudflare/container-worker/Dockerfile
          push: true
          tags: registry.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/nebria-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy Worker container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: containers deploy nebria-worker --env production

  deploy-gateway:
    runs-on: ubuntu-latest
    needs: [deploy-api-container, deploy-worker-container]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Gateway Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: infra/cloudflare/worker-gateway
