name = "nebria-gateway"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

# Development environment
[env.development]
vars = { BACKEND_ORIGIN = "http://localhost:3000", CORS_ORIGIN = "http://localhost:8080" }

# Production environment
[env.production]
routes = [
  { pattern = "nebria.com/*", zone_name = "nebria.com" },
  { pattern = "www.nebria.com/*", zone_name = "nebria.com" }
]

[env.production.vars]
BACKEND_ORIGIN = "https://nebria-api.your-account.workers.dev"
CORS_ORIGIN = "https://nebria.com"

# Bind to Pages project for frontend serving
[[env.production.bindings]]
type = "service"
name = "ASSETS"
service = "nebria-frontend"
environment = "production"
